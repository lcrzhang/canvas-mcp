[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "canvas-mcp"
version = "0.1.0.dev0"
description = "Read-only MCP server for Canvas LMS with deny-by-default scoping"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Leo" }]
# Runtime dependencies are added by the roadmap step that needs them.
# httpx2 (not httpx) because that is what the MCP SDK pulls in at step 5;
# one HTTP stack, not two.
dependencies = [
    "httpx2>=2.12",
    # mcp 2.x: FastMCP was renamed MCPServer and the API is snake_case.
    "mcp>=2.1",
    # PDF text extraction. Chosen over PyMuPDF, which extracts better but is
    # AGPL — a licence this repository cannot take on now that it is public.
    "pypdf>=5",
]

[project.scripts]
canvas-mcp = "canvas_mcp.server:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/canvas_mcp"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
